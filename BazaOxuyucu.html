<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Məlumat Bazası Oxuyucu | CodeSmile</title>
    <style>
        body { font-family: 'Courier New', Courier, monospace; background: #0f172a; color: #f8fafc; padding: 30px; }
        .container { max-width: 800px; margin: 0 auto; background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h2 { color: #fdcd00; text-align: center; margin-top: 0; }
        .control-panel { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 10px; border: 1px solid #334155; border-radius: 6px; background: #0f172a; color: white; }
        button { padding: 10px 20px; background: #0455dc; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #0342b0; }
        pre { background: #0f172a; padding: 20px; border-radius: 8px; border: 1px solid #334155; overflow-x: auto; color: #10b981; font-size: 14px; }
        .error { color: #ef4444; text-align: center; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🔒 Gizli Bazanı Oxu (db.json)</h2>
        <div class="control-panel">
            <input type="password" id="gh-token" placeholder="GitHub Access Token daxil edin...">
            <button onclick="fetchAndDecode()">Bazan Gətir və Aç</button>
        </div>
        <div id="msg" class="error"></div>
        <pre id="json-output">// Məlumatlar burada görünəcək...</pre>
    </div>

    <script>
        const REPO_OWNER = "codesmileacademy";
        const REPO_NAME = "CertificateVerifier";

        // Əvvəlki tokeni xatırlamaq üçün
        window.onload = () => {
            const savedToken = localStorage.getItem("csa_gh_token_reader");
            if (savedToken) document.getElementById("gh-token").value = savedToken;
        };

        async function fetchAndDecode() {
            const token = document.getElementById("gh-token").value.trim();
            const output = document.getElementById("json-output");
            const msg = document.getElementById("msg");
            
            if(!token) { msg.textContent = "Token daxil edilməlidir!"; return; }
            
            msg.textContent = "Yüklənir...";
            output.textContent = "";
            localStorage.setItem("csa_gh_token_reader", token); // Tokeni yadda saxla

            try {
                // GitHub-dan faylı çəkirik
                const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/database/db.json?v=${new Date().getTime()}`, {
                    headers: { "Authorization": `token ${token}` }
                });

                if (!res.ok) throw new Error("Fayl tapılmadı və ya Token yanlışdır!");
                
                const data = await res.json();
                
                // GitHub-ın bazasını oxuyuruq
                let rawJson = JSON.parse(decodeURIComponent(escape(atob(data.content))));
                let decodedData = {};

                // Əgər şifrələnibsə, şifrəni sındırıb açırıq
                if (rawJson.encrypted_data) {
                    decodedData = JSON.parse(decodeURIComponent(escape(atob(rawJson.encrypted_data))));
                } else {
                    decodedData = rawJson;
                }

                // Gözəl və oxunaqlı JSON formatında ekrana yazdırırıq
                msg.textContent = "";
                output.textContent = JSON.stringify(decodedData, null, 4);

            } catch (err) {
                msg.textContent = err.message;
            }
        }
    </script>
</body>
</html>
